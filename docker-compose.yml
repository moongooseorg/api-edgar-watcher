services:
  app:
    container_name: ${APP_NAME:?APP_NAME must be set}
    image: ${IMAGE:?IMAGE must be set}
    restart: unless-stopped
    pull_policy: missing
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    ports:
      - "${HOST_PORT:?HOST_PORT must be set}:8080"
    environment:
      BAO_ADDR: ${BAO_ADDR:?BAO_ADDR must be set}
      BAO_ROLE_ID: ${BAO_ROLE_ID:?BAO_ROLE_ID must be set}
      BAO_SECRET_ID: ${BAO_SECRET_ID:?BAO_SECRET_ID must be set}
      BAO_PATH: ${APP_NAME}
